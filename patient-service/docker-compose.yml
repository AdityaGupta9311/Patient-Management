version: '3.8'

services:
  patient-db:
    container_name: patient-service-db
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_DB: patientdb
      POSTGRES_USER: aditya
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - patient_pgdata:/var/lib/postgresql/data
    networks:
      - internal

  patient-service:
    container_name: patient-service:latest
    build: .
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://patient-db:5432/patientdb
      SPRING_DATASOURCE_USERNAME: aditya
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_SQL_INIT_MODE: always
    depends_on:
      - patient-db
    networks:
      - internal

volumes:
  patient_pgdata:


networks:
  internal:
    external: true
