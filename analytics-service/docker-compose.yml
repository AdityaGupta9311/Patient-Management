version: '3.8'

services:
  analytics-service:
    container_name: analytics-service
    build:
      context: .
      dockerfile: Dockerfile
    image: analytics-service:latest
    ports:
      - "8002:8002"
    networks:
      - internal
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

networks:
  internal:
    external: true
